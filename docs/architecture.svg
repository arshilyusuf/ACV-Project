<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <style>
    .box { fill:#e8f1fb; stroke:#24527a; stroke-width:2; rx:10; }
    .skip { fill:#fff2cc; stroke:#a66b00; stroke-width:2; rx:10; }
    .text { font: 16px Arial, sans-serif; fill:#15202b; text-anchor:middle; }
    .small { font: 13px Arial, sans-serif; fill:#15202b; text-anchor:middle; }
    .arrow { stroke:#24527a; stroke-width:2; marker-end:url(#arrow); fill:none; }
    .dashed { stroke:#a66b00; stroke-width:2; stroke-dasharray:8 6; marker-end:url(#arrowGold); fill:none; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#24527a"/>
    </marker>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#a66b00"/>
    </marker>
  </defs>
  <text x="600" y="30" class="text" font-weight="bold">Controlled U-Net zeroed-skip-fusion ablation</text>
  <rect x="40" y="260" width="130" height="70" class="box"/>
  <text x="105" y="290" class="text">Input</text><text x="105" y="313" class="small">3 x 128 x 128</text>
  <rect x="220" y="100" width="145" height="70" class="box"/>
  <text x="292" y="130" class="text">Encoder 1</text><text x="292" y="153" class="small">3 -&gt; 32</text>
  <rect x="220" y="260" width="145" height="70" class="box"/>
  <text x="292" y="290" class="text">Encoder 2</text><text x="292" y="313" class="small">32 -&gt; 64</text>
  <rect x="220" y="420" width="145" height="70" class="box"/>
  <text x="292" y="450" class="text">Encoder 3</text><text x="292" y="473" class="small">64 -&gt; 128</text>
  <rect x="460" y="260" width="150" height="70" class="box"/>
  <text x="535" y="290" class="text">Bottleneck</text><text x="535" y="313" class="small">128 -&gt; 256</text>
  <rect x="700" y="100" width="145" height="70" class="box"/>
  <text x="772" y="130" class="text">Decoder 1</text><text x="772" y="153" class="small">64 -&gt; 32</text>
  <rect x="700" y="260" width="145" height="70" class="box"/>
  <text x="772" y="290" class="text">Decoder 2</text><text x="772" y="313" class="small">128 -&gt; 64</text>
  <rect x="700" y="420" width="145" height="70" class="box"/>
  <text x="772" y="450" class="text">Decoder 3</text><text x="772" y="473" class="small">256 -&gt; 128</text>
  <rect x="940" y="260" width="150" height="70" class="box"/>
  <text x="1015" y="290" class="text">1 x 1 Head</text><text x="1015" y="313" class="small">32 -&gt; 2 classes</text>
  <rect x="445" y="65" width="180" height="55" class="skip"/>
  <text x="535" y="88" class="small">Skip fusion 1</text><text x="535" y="106" class="small">feature or zeros</text>
  <rect x="445" y="385" width="180" height="55" class="skip"/>
  <text x="535" y="408" class="small">Skip fusion 2</text><text x="535" y="426" class="small">feature or zeros</text>
  <path d="M170 295 L220 295" class="arrow"/>
  <path d="M292 170 L292 260" class="arrow"/>
  <path d="M365 295 L460 295" class="arrow"/>
  <path d="M292 330 L292 420" class="arrow"/>
  <path d="M365 455 L460 455 L460 330" class="arrow"/>
  <path d="M610 295 L700 295" class="arrow"/>
  <path d="M772 330 L772 420" class="arrow"/>
  <path d="M845 455 L940 455 L940 295" class="arrow"/>
  <path d="M365 135 L535 135 L535 120" class="dashed"/>
  <path d="M365 295 L445 295 L445 120" class="dashed"/>
  <path d="M365 455 L535 455 L535 440" class="dashed"/>
  <path d="M625 92 L700 135" class="dashed"/>
  <path d="M625 412 L700 455" class="dashed"/>
  <text x="600" y="570" class="small">Baseline: pass encoder skip tensors | Ablation: replace them with torch.zeros_like(tensor)</text>
</svg>
